<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portfolio CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-cream: #F6F8F1;
            --bg-dark: #1E4D12;
            --bg-midnight: #12330a;
            --text-primary: #222222;
            --text-muted: #556644;
            --text-light: #ffffff;
            --accent-lime: #3F8F2D;
            --accent-gold: #69B63D;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 20px 50px rgba(30, 77, 18, 0.08);
            --glass-blur: blur(25px);
            --font-display: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            margin: 0;
            background-color: var(--bg-cream);
            color: var(--text-primary);
            font-family: var(--font-body);
            display: flex;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Blobs */
        .glow-blob {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(140, 203, 89, 0.15) 0%, rgba(250, 252, 248, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .glow-blob-1 { top: -200px; left: -100px; }
        .glow-blob-2 { bottom: -200px; right: -100px; }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(30, 77, 18, 0.06);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 45px 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            border-right: 1px solid rgba(30, 77, 18, 0.08);
            z-index: 10;
        }
        
        .logo {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.3rem;
            margin-bottom: 50px;
            color: var(--bg-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo svg {
            color: var(--accent-lime);
        }

        .nav-items { display: flex; flex-direction: column; gap: 10px; }
        
        .nav-item {
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-item:hover {
            background: rgba(63, 143, 45, 0.06);
            color: var(--bg-dark);
        }
        
        .nav-item.active {
            background: var(--bg-dark);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(30, 77, 18, 0.15);
        }

        .nav-logout {
            margin-top: auto;
            color: #d93838;
            border: 1px solid rgba(217, 56, 56, 0.15);
            background: rgba(217, 56, 56, 0.02);
        }
        
        .nav-logout:hover {
            background: #d93838 !important;
            color: #ffffff !important;
            border-color: #d93838;
        }

        /* Main Content */
        .main {
            margin-left: 280px;
            flex: 1;
            padding: 60px 60px 80px 60px;
            z-index: 1;
            position: relative;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }
        
        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            color: var(--text-primary);
        }
        
        .btn-add {
            background: var(--bg-dark);
            color: #ffffff;
            padding: 15px 30px;
            border-radius: 100px;
            font-weight: 800;
            font-family: var(--font-display);
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(30, 77, 18, 0.15);
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            background: var(--accent-lime);
            box-shadow: 0 12px 30px rgba(63, 143, 45, 0.25);
        }

        /* Grid & Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }
        
        .admin-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--glass-shadow);
        }
        
        .admin-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(30, 77, 18, 0.12);
            border-color: var(--accent-lime);
        }
        
        .card-image-preview {
            width: 100%;
            height: 180px;
            background: rgba(30, 77, 18, 0.03);
            border-radius: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(30, 77, 18, 0.05);
        }
        
        .card-image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-body { flex-grow: 1; display: flex; flex-direction: column; }
        
        .admin-card h3 {
            margin: 0 0 10px 0;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        
        .card-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 20px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }
        
        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }
        
        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(30, 77, 18, 0.15);
            background: rgba(255, 255, 255, 0.4);
            font-family: inherit;
            transition: all 0.2s ease;
        }
        
        .btn-edit { color: var(--bg-dark); }
        .btn-edit:hover { background: var(--bg-dark); color: #fff; border-color: var(--bg-dark); }
        .btn-delete { color: #d93838; border-color: rgba(217, 56, 56, 0.15); }
        .btn-delete:hover { background: rgba(217, 56, 56, 0.05); border-color: #d93838; }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(18, 51, 10, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 600px;
            border-radius: 32px;
            padding: 45px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 70px rgba(30, 77, 18, 0.15);
        }
        
        .form-group { margin-bottom: 24px; text-align: left; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            font-size: 0.75rem; 
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(30, 77, 18, 0.15);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-lime);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(63, 143, 45, 0.1);
        }
        
        .preview-container {
            margin-top: 12px;
        }
        
        .image-preview {
            max-width: 120px;
            max-height: 120px;
            border-radius: 12px;
            border: 1px solid rgba(30, 77, 18, 0.1);
            display: none;
            object-fit: cover;
        }
        
        .file-upload-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 35px;
        }
        
        .btn-save {
            background: var(--bg-dark);
            color: #fff;
            padding: 16px 32px;
            border-radius: 100px;
            font-weight: 800;
            font-family: var(--font-display);
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(30, 77, 18, 0.15);
        }
        
        .btn-save:hover {
            background: var(--accent-lime);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(63, 143, 45, 0.25);
        }
        
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        
        .file-link-preview {
            background: rgba(63, 143, 45, 0.05);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px dashed rgba(63, 143, 45, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #loader {
            display: none;
            margin-top: 20px;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="sidebar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Portfolio CMS</span>
        </div>
        <div id="nav-list" class="nav-items">
            <div id="nav-projects" class="nav-item active" onclick="switchTable('projects')">Projects</div>
            <div id="nav-customers" class="nav-item" onclick="switchTable('customers')">Customers</div>
            <div id="nav-blog_posts" class="nav-item" onclick="switchTable('blog_posts')">Blog Posts</div>
            <div id="nav-footer_links" class="nav-item" onclick="switchTable('footer_links')">Footer Links</div>
            <div id="nav-section_images" class="nav-item" onclick="switchTable('section_images')">Section Images</div>
            <div id="nav-resumes" class="nav-item" onclick="switchTable('resumes')">Resumes</div>
            <div class="nav-item nav-logout" onclick="logout()">Logout</div>
        </div>
    </div>

    <div class="main">
        <header>
            <h1 id="table-title">Projects</h1>
            <button class="btn-add" onclick="openModal()">+ Add New</button>
        </header>

        <div id="content-grid" class="card-grid">
            <!-- Dynamic Content -->
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; margin-bottom: 30px; color: var(--text-primary);">Add New Record</h2>
            <form id="cms-form" onsubmit="event.preventDefault();">
                <!-- Fields Injected Here -->
            </form>
            <div id="loader">Processing... please wait.</div>
            <div class="modal-footer">
                <button class="btn-action" onclick="closeModal()" style="border-radius: 100px;">Cancel</button>
                <button class="btn-save" id="save-btn" onclick="saveData()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kfcqfaqkxbsvjatzjxfd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmY3FmYXFreGJzdmphdHpqeGZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDg4ODksImV4cCI6MjA4OTMyNDg4OX0.ReAzLZ_uxSeXoNIIA0oTSnjdvNjP48HxpMA_X6BpXbs';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentTable = 'projects';
        let currentData = [];
        let editingId = null;

        const tableConfigs = {
            projects: {
                title: 'Projects',
                storagePath: 'projects',
                fields: [
                    { name: 'title', label: 'Title', type: 'text' },
                    { name: 'category', label: 'Category', type: 'text' },
                    { name: 'description', label: 'Description', type: 'textarea' },
                    { name: 'image', label: 'Project Dashboard Image', type: 'image' },
                    { name: 'link', label: 'Project Link', type: 'text' },
                    { name: 'tech', label: 'Tech Stack (comma separated)', type: 'text' },
                    { name: 'case_study_label', label: 'CTA Label', type: 'text' }
                ]
            },
            customers: {
                title: 'Customers',
                storagePath: 'avatars',
                fields: [
                    { name: 'name', label: 'Name', type: 'text' },
                    { name: 'role', label: 'Role', type: 'text' },
                    { name: 'review', label: 'Review', type: 'textarea' },
                    { name: 'avatar', label: 'Customer Avatar', type: 'image' },
                    { name: 'rating', label: 'Rating (1-5)', type: 'number' },
                    { name: 'bg_class', label: 'BG Style (bg-lime, bg-dark, bg-cream)', type: 'text' },
                    { name: 'tilt_class', label: 'Tilt (tilt-left, tilt-right)', type: 'text' }
                ]
            },
            blog_posts: {
                title: 'Blog Posts',
                storagePath: 'blog',
                fields: [
                    { name: 'title', label: 'Title', type: 'text' },
                    { name: 'excerpt', label: 'Excerpt', type: 'textarea' },
                    { name: 'image', label: 'Cover Image', type: 'image' },
                    { name: 'link', label: 'URL', type: 'text' }
                ]
            },
            footer_links: {
                title: 'Footer Links',
                storagePath: 'icons',
                fields: [
                    { name: 'title', label: 'Title', type: 'text' },
                    { name: 'url', label: 'URL', type: 'text' },
                    { name: 'icon', label: 'Icon (Emoji or Upload Image)', type: 'text' },
                    { name: 'type', label: 'Type', type: 'select', options: ['nav', 'social'] }
                ]
            },
            section_images: {
                title: 'Section Images',
                storagePath: 'hero',
                fields: [
                    { name: 'section_name', label: 'Section ID', type: 'text' },
                    { name: 'image_url', label: 'Section Visual', type: 'image' }
                ]
            },
            resumes: {
                title: 'Resumes',
                storagePath: '',
                bucket: 'resumes',
                fields: [
                    { name: 'name', label: 'Resume Name (e.g. Cibirajan V Resume.pdf)', type: 'text' },
                    { name: 'url', label: 'Resume PDF Upload', type: 'file' },
                    { name: 'version', label: 'Version', type: 'text' }
                ]
            }
        };

        async function switchTable(table) {
            currentTable = table;
            document.getElementById('table-title').innerText = tableConfigs[table].title;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${table}`).classList.add('active');
            fetchData();
        }

        async function fetchData() {
            const { data, error } = await supabaseClient.from(currentTable).select('*').order('created_at', { ascending: false });
            if (error) alert(error.message);
            currentData = data || [];
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('content-grid');
            if (currentData.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px; font-weight: 600;">No records found.</div>`;
                return;
            }
            grid.innerHTML = currentData.map(item => {
                const img = item.image || item.avatar || item.image_url || null;
                const title = item.title || item.name || item.section_name || 'Untitled';
                const sub = item.description || item.review || item.excerpt || item.url || '';
                
                let previewHtml = '';
                if (img) {
                    previewHtml = `<div class="card-image-preview"><img src="${img}" alt="Preview" onerror="this.parentElement.style.display='none'"></div>`;
                } else if (currentTable === 'resumes' && item.url) {
                    previewHtml = `<div class="card-image-preview" style="display: flex; align-items: center; justify-content: center; background: rgba(63, 143, 45, 0.05); color: var(--accent-lime); font-size: 3rem;">📄</div>`;
                }
                
                return `
                <div class="admin-card">
                    ${previewHtml}
                    <div class="card-body">
                        <h3>${title}</h3>
                        <p class="card-subtitle">${sub}</p>
                        ${currentTable === 'resumes' && item.version ? `<div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 15px;">Version: ${item.version}</div>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="btn-action btn-edit" onclick="editItem('${item.id}')">Edit</button>
                        <button class="btn-action btn-delete" onclick="deleteItem('${item.id}')">Delete</button>
                    </div>
                </div>
            `}).join('');
        }

        function openModal(editingItem = null) {
            editingId = editingItem ? editingItem.id : null;
            document.getElementById('modal-title').innerText = editingId ? 'Update Record' : 'Add New Record';
            document.getElementById('modal').style.display = 'flex';
            
            const form = document.getElementById('cms-form');
            const config = tableConfigs[currentTable];
            
            form.innerHTML = config.fields.map(field => {
                let val = '';
                if(editingItem) {
                    val = editingItem[field.name];
                    if(field.name === 'tech' && Array.isArray(val)) val = val.join(', ');
                }
                
                if (field.type === 'image' || field.type === 'file') {
                    const acceptAttr = field.type === 'image' ? 'accept="image/*"' : 'accept="application/pdf"';
                    const previewHtml = field.type === 'image' 
                        ? `<img id="preview-${field.name}" src="${val || ''}" class="image-preview" style="${val ? 'display:block;' : ''}">`
                        : `<div id="preview-file-link-${field.name}" class="file-link-preview" style="${val ? 'display:flex;' : 'display:none;'}">
                             📄 <a href="${val || '#'}" target="_blank" id="link-${field.name}" style="color: var(--accent-lime); font-weight: 600; text-decoration: none;">${val ? val.split('/').pop() : ''}</a>
                           </div>`;
                    return `
                        <div class="form-group">
                            <label>${field.label}</label>
                            <div class="file-upload-wrapper">
                                <input type="file" id="file-${field.name}" ${acceptAttr} onchange="previewFile(this, '${field.name}', '${field.type}')">
                                <input type="hidden" id="field-${field.name}" value="${val || ''}">
                            </div>
                            <div class="preview-container">
                                ${previewHtml}
                            </div>
                        </div>
                    `;
                }
                
                return `
                    <div class="form-group">
                        <label>${field.label}</label>
                        ${field.type === 'textarea' 
                            ? `<textarea id="field-${field.name}" rows="4">${val || ''}</textarea>` 
                            : field.type === 'select'
                                ? `<select id="field-${field.name}">${field.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`
                                : `<input type="${field.type}" id="field-${field.name}" value="${val || ''}">`
                        }
                    </div>
                `;
            }).join('');
        }

        function previewFile(input, fieldName, type) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                if (type === 'image') {
                    const preview = document.getElementById(`preview-${fieldName}`);
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    const container = document.getElementById(`preview-file-link-${fieldName}`);
                    const link = document.getElementById(`link-${fieldName}`);
                    if (container && link) {
                        link.href = '#';
                        link.innerText = file.name + ' (Selected for upload)';
                        container.style.display = 'flex';
                    }
                }
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        async function editItem(id) {
            const item = currentData.find(d => d.id === id);
            openModal(item);
        }

        async function uploadFile(field) {
            const fileInput = document.getElementById(`file-${field.name}`);
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) return null;

            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
            
            const config = tableConfigs[currentTable];
            const folder = config.storagePath;
            const filePath = folder ? `${folder}/${fileName}` : fileName;
            const bucket = config.bucket || 'portfolio';

            const { data, error } = await supabaseClient.storage
                .from(bucket)
                .upload(filePath, file, { upsert: true });

            if (error) throw error;

            return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${filePath}`;
        }

        async function saveData() {
            setLoading(true);
            const config = tableConfigs[currentTable];
            const payload = {};
            
            try {
                for (const field of config.fields) {
                    if (field.type === 'image' || field.type === 'file') {
                        const newUrl = await uploadFile(field);
                        payload[field.name] = newUrl || document.getElementById(`field-${field.name}`).value;
                    } else {
                        let val = document.getElementById(`field-${field.name}`).value;
                        if(field.name === 'tech') val = val.split(',').map(t => t.trim());
                        if(field.name === 'rating') val = parseInt(val) || 5;
                        payload[field.name] = val;
                    }
                }

                let error;
                if(editingId) {
                    const { error: err } = await supabaseClient.from(currentTable).update(payload).eq('id', editingId);
                    error = err;
                } else {
                    const { error: err } = await supabaseClient.from(currentTable).insert([payload]);
                    error = err;
                }

                if (error) throw error;
                
                closeModal();
                fetchData();
            } catch (err) {
                alert(err.message);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            const btn = document.getElementById('save-btn');
            const loader = document.getElementById('loader');
            btn.disabled = isLoading;
            btn.innerText = isLoading ? 'Saving...' : 'Save Changes';
            loader.style.display = isLoading ? 'block' : 'none';
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this record?')) return;
            const { error } = await supabaseClient.from(currentTable).delete().eq('id', id);
            if (error) alert(error.message);
            else fetchData();
        }

        function setAuth() {
            const isAuth = localStorage.getItem('cms_auth') === 'true';
            if(!isAuth) {
                window.location.href = 'login.html';
            } else {
                fetchData();
            }
        }

        function logout() {
            localStorage.removeItem('cms_auth');
            window.location.href = 'login.html?logout';
        }

        setAuth();
    </script>
</body>
</html>
