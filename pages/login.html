<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portfolio CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-cream: #F6F8F1;
            --accent-lime: #3F8F2D;
            --bg-dark: #1E4D12;
            --text-primary: #222222;
            --text-muted: #556644;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 20px 50px rgba(30, 77, 18, 0.08);
            --glass-blur: blur(25px);
            --font-display: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-cream);
            color: var(--text-primary);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Blobs */
        .glow-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(140, 203, 89, 0.18) 0%, rgba(250, 252, 248, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .glow-blob-1 { top: -200px; left: -200px; }
        .glow-blob-2 { bottom: -200px; right: -200px; }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            width: 100%;
            max-width: 440px;
            padding: 60px 45px;
            border-radius: 32px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            text-align: center;
            z-index: 10;
        }
        
        .logo {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.4rem;
            color: var(--bg-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo svg {
            color: var(--accent-lime);
        }
        
        h1 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 35px;
            color: var(--text-primary);
        }
        
        .form-group { text-align: left; margin-bottom: 24px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            font-size: 0.75rem; 
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(30, 77, 18, 0.15);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent-lime);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(63, 143, 45, 0.1);
        }
        
        .btn-login {
            background: var(--bg-dark);
            color: #ffffff;
            width: 100%;
            padding: 18px;
            border-radius: 100px;
            border: none;
            font-weight: 800;
            font-family: var(--font-display);
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(30, 77, 18, 0.15);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            background: var(--accent-lime);
            box-shadow: 0 12px 30px rgba(63, 143, 45, 0.25);
        }
        
        #error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 20px;
            display: none;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <div class="login-card">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Portfolio CMS</span>
        </div>
        <h1>Welcome Back</h1>
        <form id="login-form">
            <div class="form-group">
                <label>User ID</label>
                <input type="email" id="email" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Unlock Dashboard</button>
            <div id="error-msg">❌ Invalid credentials. Please try again.</div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://kfcqfaqkxbsvjatzjxfd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmY3FmYXFreGJzdmphdHpqeGZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3NDg4ODksImV4cCI6MjA4OTMyNDg4OX0.ReAzLZ_uxSeXoNIIA0oTSnjdvNjP48HxpMA_X6BpXbs';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            submitBtn.disabled = true;
            submitBtn.innerText = "Authenticating...";

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                
                if (error) throw error;

                if (data.session) {
                    localStorage.setItem('cms_auth', 'true');
                    localStorage.setItem('cms_user', email);
                    window.location.href = 'admin.html';
                }
            } catch (err) {
                errorMsg.innerText = "❌ " + err.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = "Unlock Dashboard";
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 4000);
            }
        });

        if(window.location.search === '?logout') {
            localStorage.removeItem('cms_auth');
            localStorage.removeItem('cms_user');
        }
    </script>
</body>
</html>
